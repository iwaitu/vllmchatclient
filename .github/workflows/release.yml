name: Release

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Microsoft.Extensions.AI.VllmChatClient/Microsoft.Extensions.AI.VllmChatClient.csproj'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'Microsoft.Extensions.AI.VllmChatClient/Microsoft.Extensions.AI.VllmChatClient.csproj'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Read version from project file
      id: project_version
      shell: pwsh
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        [xml]$proj = Get-Content "${{ env.PROJECT_PATH }}"
        $version = $proj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
        if ([string]::IsNullOrWhiteSpace($version)) {
          Write-Error "Version not found in project file."
          exit 1
        }
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        Write-Host "Using version: $version"

        # Manual dispatch can retry a failed publish without another version bump.
        $publish = $true
        if ($env:EVENT_NAME -eq 'push') {
          $previousContent = git show "${env:BEFORE_SHA}:$env:PROJECT_PATH"
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot read the version before this push. Use workflow_dispatch to release manually."
          }
          [xml]$previousProj = $previousContent -join "`n"
          $previousVersion = $previousProj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($previousVersion)) {
            throw "Version not found before this push. Use workflow_dispatch to release manually."
          }
          $publish = $version -ne $previousVersion
          if (-not $publish) {
            Write-Host "Version unchanged ($version); skipping release and NuGet publish."
          }
        }
        "publish=$($publish.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Create Git Tag
      if: steps.project_version.outputs.publish == 'true'
      id: tag
      run: |
        version="${{ steps.project_version.outputs.version }}"
        if git rev-parse "v$version" >/dev/null 2>&1; then
          echo "Tag v$version already exists."
          git checkout --detach "v$version"
          echo "created=false" >> $GITHUB_OUTPUT
        else
          git tag "v$version"
          git push origin "v$version"
          echo "created=true" >> $GITHUB_OUTPUT
        fi

    - name: Build and Pack
      if: steps.project_version.outputs.publish == 'true'
      run: |
        dotnet restore ${{ env.PROJECT_PATH }}
        dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore
        dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./artifacts

    - name: Resolve NuGet package
      if: steps.project_version.outputs.publish == 'true'
      id: package
      shell: pwsh
      run: |
        $metadataJson = dotnet msbuild "$env:PROJECT_PATH" -getProperty:PackageId,PackageVersion
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $metadata = ($metadataJson -join "`n") | ConvertFrom-Json
        $packageId = $metadata.Properties.PackageId
        $packageVersion = $metadata.Properties.PackageVersion
        if ([string]::IsNullOrWhiteSpace($packageId) -or [string]::IsNullOrWhiteSpace($packageVersion)) {
          throw "PackageId or PackageVersion is missing."
        }
        if ($packageVersion -ne "${{ steps.project_version.outputs.version }}") {
          throw "Package version does not match the release tag."
        }
        $packagePath = "./artifacts/$packageId.$packageVersion.nupkg"
        if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
          throw "NuGet package not found: $packagePath"
        }
        "id=$packageId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "path=$packagePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Create GitHub Release
      if: steps.project_version.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_VERSION: ${{ steps.project_version.outputs.version }}
        PACKAGE_ID: ${{ steps.package.outputs.id }}
      run: |
        tag="v$RELEASE_VERSION"
        if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Release $RELEASE_VERSION" \
            --notes "Install: dotnet add package $PACKAGE_ID --version $RELEASE_VERSION"
        fi

    - name: Upload NuGet package to release
      if: steps.project_version.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_VERSION: ${{ steps.project_version.outputs.version }}
        PACKAGE_PATH: ${{ steps.package.outputs.path }}
      run: gh release upload "v$RELEASE_VERSION" "$PACKAGE_PATH" --repo "$GITHUB_REPOSITORY" --clobber

    # Tags pushed with GITHUB_TOKEN do not trigger the other workflow's tag-push publisher.
    - name: Publish to NuGet.org
      if: steps.project_version.outputs.publish == 'true'
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        PACKAGE_PATH: ${{ steps.package.outputs.path }}
      run: |
        if [ -z "$NUGET_API_KEY" ]; then
          echo "::error::Repository secret NUGET_API_KEY is missing."
          exit 1
        fi
        dotnet nuget push "$PACKAGE_PATH" \
          --api-key "$NUGET_API_KEY" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
