name: Build NuGet Package

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'Microsoft.Extensions.AI.VllmChatClient.sln'
  PROJECT_PATH: 'Microsoft.Extensions.AI.VllmChatClient/Microsoft.Extensions.AI.VllmChatClient.csproj'
  TEST_PROJECT_PATH: 'VllmChatClient.Test/VllmChatClient.Test.csproj'
  NATIVE_AOT_SMOKE_PATH: 'samples/NativeAotSmoke/NativeAotSmoke.csproj'
  OFFLINE_TEST_FILTER: 'FullyQualifiedName~StreamingCompletionTests|FullyQualifiedName~ToolResultArraySerializationTests|FullyQualifiedName~ContentArrayTextSerializationTests|FullyQualifiedName~RawJsonStringConverterTests|FullyQualifiedName~Qwen3NextToolHistoryTests|FullyQualifiedName~ResponsesApiModeTests|FullyQualifiedName~AnthropicApiModeTests|FullyQualifiedName~Gemini3ProviderCompatibilityTests|FullyQualifiedName~Gemma4ProviderCompatibilityTests|FullyQualifiedName~Gemma4NativeToolCallingTests|FullyQualifiedName~NemotronProviderCompatibilityTests|FullyQualifiedName~MimoProviderCompatibilityTests|FullyQualifiedName~DeepseekV4HistoryReplayTests|FullyQualifiedName~DeepseekSafetyTagFilterTests|FullyQualifiedName~VllmChatClient.Test.Sonnet55NativeCompatibilityTests'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 获取完整历史记录以便版本控制

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore solution dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

    - name: Offline protocol and serialization regression tests
      run: |
        dotnet test "$TEST_PROJECT_PATH" --configuration Release --no-build \
          --filter "$OFFLINE_TEST_FILTER" --logger "trx;LogFileName=offline.trx" \
          --results-directory ./artifacts/test-results

    - name: NativeAOT smoke publish and run
      run: |
        dotnet publish "$NATIVE_AOT_SMOKE_PATH" --configuration Release --no-restore \
          -p:PublishAot=true --output ./artifacts/native-aot
        ./artifacts/native-aot/NativeAotSmoke

    - name: Create NuGet package
      run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./artifacts

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg

  # NuGet.org publishing runs only in release.yml, as required by its trusted policy.
  # 可选：发布到 GitHub Packages
  publish-github:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Publish to GitHub Packages
      run: |
        for package in ./artifacts/*.nupkg; do
          echo "Publishing $package to GitHub Packages..."
          dotnet nuget push "$package" --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
        done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
